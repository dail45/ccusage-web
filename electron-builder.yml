appId: com.dail45.ccusage-web
productName: ccusage
directories:
  output: dist-electron
  buildResources: build

# Only the Electron shell goes into app.asar. The Next.js runtime (next, react,
# ccusage native binary, ...) lives in the standalone server dir shipped via
# extraResources below.
files:
  - electron/**/*
  - build/icon.ico
  - build/icon.png
  - package.json
  - "!node_modules/**/*"
  - node_modules/electron-updater/**/*
  - node_modules/builder-util-runtime/**/*
  - node_modules/fs-extra/**/*
  - node_modules/graceful-fs/**/*
  - node_modules/jsonfile/**/*
  - node_modules/universalify/**/*
  - node_modules/js-yaml/**/*
  - node_modules/argparse/**/*
  - node_modules/lazy-val/**/*
  - node_modules/lodash.escaperegexp/**/*
  - node_modules/lodash.isequal/**/*
  - node_modules/semver/**/*
  - node_modules/tiny-typed-emitter/**/*
  - node_modules/debug/**/*
  - node_modules/ms/**/*
  - node_modules/sax/**/*

# NOTE: electron-builder always drops the root "node_modules" directory of an
# extraResources "from" folder, so node_modules is copied by its own entry.
extraResources:
  - from: .next/standalone
    to: server
    filter:
      - "**/*"
  - from: .next/standalone/node_modules
    to: server/node_modules
    filter:
      - "**/*"

npmRebuild: false
asar: true

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-Setup-${version}.${ext}
portable:
  artifactName: ${productName}-Portable-${version}.${ext}

mac:
  icon: build/icon.png
  # The bundled ccusage binary is per-arch, so each arch is built on its own
  # runner (arm64 on macos-latest, x64 on macos-15-intel); arch comes from CLI.
  target: dmg
  artifactName: ${productName}-${version}-${arch}.${ext}
  category: public.app-category.developer-tools
linux:
  icon: build/icon.png
  target: AppImage
  category: Development

# Installers are uploaded and published directly to the GitHub release for the tag
# (see .github/workflows/release.yml).
publish:
  provider: github
  owner: dail45
  repo: ccusage-web
  releaseType: release
